      created_at: '2026-08-28'
      reviewed_by: null
  - from: fab.anomaly.overlay_shift
    type: mitigated_by
    to: fab.action.hold_lot
    note: 根因未明前先扣留，避免在有问题的机台上重复报废
    provenance:
      source_type: model_prior
      ref: null
      confidence: medium
      created_at: '2026-08-28'
      reviewed_by: null
  - from: fab.anomaly.overlay_shift
    type: mitigated_by
    to: fab.action.dispatch_field_service
    note: 对位系统或镜头热补偿异常且厂内手段无效时报修
    provenance:

      created_at: '2026-08-28'
      reviewed_by: null

  # ---- 机台状态作为独立异常来源（Equipment -> Anomaly）----
  # 只收"机台自身状态"这一类成因：老化、PM 逾期、腔体/耗材条件、Tool-to-Tool
  # 差异。判据是它不能被已有的 Parameter 或 Cause 覆盖——参数是人调的设定值，
  # 机台状态是设定值不变也会漂的那部分。因此这里不写"某机跑了这道工序所以
  # 可能出该工序的异常"，那种边只是工序归属的重复，没有排查价值。
  #
  # 停机类异常（scanner_down / equipment_down）刻意不连：那类异常本身就是
  # 机台失能，Equipment -> 它是同义反复。
  #
  # likelihood 一律留空：机台维度的先验频度需要现场 PM 记录与稼动数据支撑，
  # 没有 kb 实例可依。留空表示未评估，比随手填一个数字诚实。

    note: '与卷材/板材涂布行业的涂布量偏差同构：同为"沉积源几何 + 耗材侵蚀 状态 + 腔体/涂布头预处理"三者决定横向分布，都靠径向（横幅）剖面 形状而非单点均值定位根因。可复用的是"先看剖面形状再看均值"的
      判别顺序与"预处理省不掉"这条经验。

      '
    provenance:

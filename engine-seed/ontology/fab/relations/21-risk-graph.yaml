      created_at: '2026-08-28'
      reviewed_by: null
  - from: fab.anomaly.scanner_down
    type: mitigated_by
    to: fab.action.dispatch_field_service
    note: 原厂锁定模块的唯一合规路径
    confidence: medium
    provenance:
